<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada · Acordes para o Futuro</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #23282c;
      color: #eef1f2;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    p.kicker { color: #f4c430; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; font-size: .85rem; }
    h1 { font-family: Georgia, serif; font-weight: 600; font-size: clamp(2rem, 6vw, 3rem); margin: .2em 0 .4em; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 22px;
      border-radius: 999px;
      background: #f4c430;
      color: #23282c;
      font-weight: 700;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Acordes para o Futuro</p>
    <h1>Página não encontrada</h1>
    <p>O endereço que você abriu não existe ou mudou de lugar.</p>
    <a href="/">Ir para a página inicial</a>
  </main>
</body>
</html>
